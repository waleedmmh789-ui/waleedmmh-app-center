
name: Extract Website ZIP

on:
  push:
    branches:
      - main
    paths:
      - 'waleedmmh-site-dist.zip'

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Get repository
        uses: actions/checkout@v4

      - name: Extract website
        run: |
          unzip -o waleedmmh-site-dist.zip -d .
          rm waleedmmh-site-dist.zip

      - name: Save extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Extract WALEEDMMH website"
            git push
          fi
